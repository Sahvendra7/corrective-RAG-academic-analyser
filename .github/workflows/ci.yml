name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only torch: the default wheel pulls several GB of CUDA libraries.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install .[test] ruff

    - name: Lint (undefined names, redefinitions, syntax errors)
      run: ruff check --select F821,F811,E9 src ui tests

    - name: Run tests
      # Hermetic: no network, no API keys, no model downloads.
      # Network / LLM tests are opt-in: `pytest -m network`, `pytest -m llm`.
      run: pytest
