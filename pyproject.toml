[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crag"
version = "0.1.0"
description = "Corrective Retrieval Augmented Generation (CRAG) Implementation"
requires-python = ">=3.10,<3.13"  # numpy<2 has no wheels for 3.13; CI tests 3.10–3.12
dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "google-generativeai>=0.8.0,<1.0.0",
    "langgraph>=0.2.0,<0.3.0",
    "faiss-cpu>=1.8.0,<2.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "streamlit>=1.38.0,<2.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "tavily-python>=0.5.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "ragas>=0.2.0,<0.5.0",
    "datasets>=2.15.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "arxiv>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",  # FastAPI TestClient
]
eval = [
    "google-genai>=1.0.0,<2.0.0",  # src/evaluation/generate_eval_dataset.py
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run is hermetic: no network, no API keys, no model downloads.
# Opt in with e.g. `pytest -m network` or `pytest -m "llm"`.
addopts = "-m 'not network and not llm'"
markers = [
    "network: needs internet access (arXiv, Hugging Face model download)",
    "llm: needs GEMINI_API_KEY and makes paid/rate-limited LLM calls",
]
filterwarnings = [
    # Raised at import by ragas (only used by the opt-in LLM evaluation tests).
    "ignore:Langchain.*Wrapper is deprecated:DeprecationWarning",
]
